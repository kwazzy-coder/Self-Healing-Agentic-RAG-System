name: ablation_max_rounds_3
description: 3 correction rounds.
seeds:
- 42
- 123
- 456
retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 7
  bm25_weight: 0.3
  dense_weight: 0.7
  fusion_method: linear
  enabled: true
healing:
  enabled: true
  max_correction_attempts: 3
  confidence_threshold: 0.6
  use_nli_grounding: true
  nli_model: cross-encoder/nli-deberta-v3-small
  decompose_questions: true
llm:
  backend: gemini
  temperature: 0.0
  max_answer_words: 8
  context_char_limit: 3000
dataset:
  name: hotpotqa
  split: validation
  n_samples: 100
metrics:
- em
- f1
- rouge_l
- faithfulness
compare_baseline: true
