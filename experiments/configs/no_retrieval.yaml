name: no_retrieval
description: LLM-only baseline (no retrieval at all).
seeds:
- 42
- 123
- 456
retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 0
  bm25_weight: 0.0
  dense_weight: 0.0
  fusion_method: linear
  enabled: false
healing:
  enabled: false
  max_correction_attempts: 0
  confidence_threshold: 0.6
  use_nli_grounding: false
  nli_model: cross-encoder/nli-deberta-v3-small
  decompose_questions: false
llm:
  backend: gemini
  temperature: 0.0
  max_answer_words: 8
  context_char_limit: 3000
dataset:
  name: hotpotqa
  split: validation
  n_samples: 100
metrics:
- em
- f1
- rouge_l
- faithfulness
compare_baseline: true
